name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK firmada
        run: gradle --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }}

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk despertador-nfc-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: despertador-nfc-apk
          path: despertador-nfc-*.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" despertador-nfc-*.apk \
            --title "Despertador NFC 1.0.${{ github.run_number }}" \
            --notes "Compilación automática del commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
